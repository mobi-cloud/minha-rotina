<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="minha rotina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#7A7F8C">
<title>minha rotina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
:root{
  --court:#7A7F8C; --court-ink:#FFFFFF; --pink:#FFCFDD; --pink-ink:#3B2530;
  --bg:#F4F4F6; --card:#FFFFFF; --ink:#22242B; --muted:#6C6F7A; --line:#E3E4E9; --soft:#ECEDF1; --danger:#D2432F;
  --along:#4F86A8; --mob:#8A73C4; --rolo:#D9577F;
  --font:"DM Sans", system-ui, sans-serif; --display:"DM Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --court:#4A4E59; --bg:#17181C; --card:#22242A; --ink:#F0F1F4; --muted:#A4A7B2; --line:#33363E; --soft:#2B2D34;
    --along:#7FB0CF; --mob:#AE9BE0; --rolo:#F08AAA; --danger:#FF7E6A;
  }
}
:root[data-theme="dark"]{
  --court:#4A4E59; --bg:#17181C; --card:#22242A; --ink:#F0F1F4; --muted:#A4A7B2; --line:#33363E; --soft:#2B2D34;
  --along:#7FB0CF; --mob:#AE9BE0; --rolo:#F08AAA; --danger:#FF7E6A;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

/* Topo em forma de quadra */
.hero{background:var(--court);color:var(--court-ink);padding:calc(26px + env(safe-area-inset-top,0px)) 18px 26px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border:0 solid rgba(255,255,255,.4)}
.hero::before{left:-10px;right:-10px;bottom:14px;border-top-width:2px}
.hero::after{left:50%;top:0;bottom:14px;border-left-width:2px}
.hero-in{max-width:640px;margin:0 auto;position:relative}
h1{margin:0;font-family:var(--display);font-size:clamp(2.6rem,12vw,3.4rem);font-weight:700;letter-spacing:-.045em;line-height:1}
.hero small{display:block;margin-top:4px;opacity:.9;font-size:.95rem}

.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(170px + var(--sab))}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 13px;font-size:.88rem;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;display:block}
.chip[aria-pressed="true"]{border-color:var(--court);background:var(--court);color:#fff}
.progress{display:flex;align-items:center;gap:12px;margin:0 0 16px;color:var(--muted);font-size:.92rem}
.bar{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--court);width:0;transition:width .3s}
.linkbtn{background:none;border:0;padding:6px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.ex{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.ex.done{opacity:.55}
.media{background:var(--soft);aspect-ratio:4/3;display:grid;place-items:center;color:var(--muted);font-size:.9rem}
.media img,.media video,.media iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.ex-body{padding:12px 14px 10px}
.ex-head{display:flex;align-items:flex-start;gap:12px}
.ex-head .t{flex:1;min-width:0}
.tag{display:inline-block;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:8px;color:#fff;margin-bottom:6px}
.tag.alongamento{background:var(--along)} .tag.mobilidade{background:var(--mob)} .tag.rolo{background:var(--rolo)}
.ex h2{margin:0;font-size:1.15rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.ex .desc{margin:6px 0 0;white-space:pre-wrap;color:var(--muted);overflow-wrap:anywhere}
.check{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:none;display:grid;place-items:center;color:transparent;cursor:pointer}
.check svg{width:16px;height:16px}
.ex.done .check{background:var(--court);border-color:var(--court);color:#fff}
.ex-foot{display:flex;justify-content:flex-end;gap:4px;margin-top:4px}

.entry{background:var(--card);border-radius:22px;border:1px solid var(--line);padding:16px 16px 10px}
.entry .wk{font-size:.82rem;font-weight:700;color:var(--muted)}
.entry h2{margin:2px 0 10px;font-size:1.25rem;font-weight:700;letter-spacing:-.01em;line-height:1.15;overflow-wrap:anywhere}
.entry ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.entry li{display:flex;gap:10px;align-items:flex-start;overflow-wrap:anywhere}
.entry li::before{content:"";flex:none;width:9px;height:9px;border-radius:3px;background:var(--pink);box-shadow:0 0 0 2px var(--court);margin-top:8px}
.entry .none{color:var(--muted);font-size:.95rem}

.empty{text-align:center;padding:34px 22px;border:2px dashed var(--line);border-radius:14px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px}

/* Botão e abas embaixo */
.add{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(92px + var(--sab));border:0;border-radius:14px;padding:14px 22px;font-weight:700;font-size:1rem;background:var(--pink);color:var(--pink-ink);cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.16);white-space:nowrap;z-index:6}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(10px + var(--sab))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.82rem;font-weight:600;padding:6px 0;cursor:pointer}
.tabs svg{width:25px;height:25px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:800}
.tabs svg{box-sizing:content-box;padding:3px 12px;border-radius:10px}
.tabs button[aria-selected="true"] svg{background:var(--pink);color:var(--pink-ink)}

/* Formulários */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 20px));max-height:calc(100% - 40px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(23,24,28,.55)}
form{padding:22px}
form h3{margin:0;font-size:1.45rem;font-weight:700;letter-spacing:-.02em}
label,.lbl{display:block;font-weight:600;margin:18px 0 8px;font-size:.95rem}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.types button[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:#fff}
.types button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 4px;font-weight:700;font-size:.9rem;cursor:pointer}
.where{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.where button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:11px;font-weight:700;cursor:pointer}
.where button[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:#fff}
.photo{display:block;border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;font-weight:600;margin:0}
.photo input{display:none}
.preview{margin-top:10px;border-radius:10px;overflow:hidden}
.preview img,.preview video{width:100%;max-height:240px;object-fit:cover;display:block}
.learn{display:flex;flex-direction:column;gap:8px}
.learn .ln{display:flex;gap:8px}
.learn .ln input{flex:1}
.learn .ln button{flex:none;width:44px;border:0;border-radius:10px;background:var(--soft);cursor:pointer;font-size:1.2rem;color:var(--muted)}
.addline{margin-top:8px;border:0;background:none;font-weight:700;cursor:pointer;padding:6px 0}
.row{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:24px}
.btn{font-weight:700;border-radius:12px;padding:12px 20px;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.btn.primary{border:0;background:var(--pink);color:var(--pink-ink)}
.btn.del{border:0;color:var(--danger);margin-right:auto;padding-left:0}
.btn:disabled{opacity:.5}
.err{color:var(--danger);font-size:.9rem;margin:10px 0 0;min-height:1em}
.status{font-size:.82rem;color:var(--muted);margin-top:24px;text-align:center}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--along);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Grupos numerados */
.group{list-style:none;margin:0 0 10px}
.group-h{width:100%;padding-left:20px!important;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:15px 16px;cursor:pointer;text-align:left}
.group.open .group-h{margin-bottom:12px}
.group-h .chev{width:20px;height:20px;color:var(--muted);transition:transform .2s;flex:none}
.group.open .group-h .chev{transform:rotate(90deg)}
.group .gempty{color:var(--muted);text-align:center;padding:14px;border:2px dashed var(--line);border-radius:22px}
.group .gadd{display:block;margin:12px auto 0;border:0;background:var(--pink);color:var(--pink-ink);font-weight:700;border-radius:12px;padding:10px 18px;cursor:pointer}
.group-h{display:flex;align-items:center;gap:10px}
.group-h .n{min-width:18px;text-align:left;color:var(--court);font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1;flex:none}
.group-h h2{margin:0;font-family:var(--display);font-size:1.3rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.group-h small{color:var(--muted);font-weight:600;font-size:.85rem;margin-left:auto}


.group > ol{list-style:none;margin:0 0 4px 14px;padding:0;display:flex;flex-direction:column;gap:8px}
.ex{position:relative}
.ex .num{flex:none;min-width:14px;font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--muted)}

.ex-top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ex-top h3{flex:1;min-width:0;margin:0;font-size:.98rem;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.slide .cap{padding:4px 14px 2px}
.slide .cap b{display:block;font-size:1rem;overflow-wrap:anywhere}
.slide .cap p{margin:2px 0 0;font-size:.9rem;white-space:pre-wrap;color:var(--muted);overflow-wrap:anywhere}
.slide .optlbl{font-size:.75rem;font-weight:700;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:6px;padding:10px 0 0}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:all .2s}
.dots i.on{background:var(--ink);width:18px;border-radius:4px}
.ex-foot{padding:0 8px 4px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:0}
.ex-foot .linkbtn{font-size:.78rem;padding:5px 6px}
.swipe{font-size:.78rem;color:var(--muted);font-weight:600;margin-right:auto;align-self:center;padding-left:4px}
.altnote{margin:6px 0 0;color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:0 16px;margin:0 0 16px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;padding:13px 0;color:var(--ink);outline:none}
.search:focus-within{border-color:var(--court)}
mark{background:var(--pink);color:var(--pink-ink);border-radius:3px;padding:0 2px}
.ex-top{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.slide{touch-action:pan-x pan-y}
.optcount{font-size:.75rem;font-weight:600;color:var(--muted);flex:none}
.altlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.altlist li{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:8px 10px 8px 14px}
.altlist li span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.altlist .linkbtn{font-size:.85rem}
html,body{overscroll-behavior-y:none}
.entry{padding:0!important;overflow:hidden}
.entry-h{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:15px 16px 15px 20px;cursor:pointer;color:inherit}
.entry-h .t{flex:1;min-width:0}
.entry-h b{display:block;font-size:1.1rem;font-weight:700;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere}
.entry-h small{display:block;color:var(--muted);font-size:.85rem;font-weight:600;margin-top:2px}
.entry-h em{font-style:normal;font-size:.8rem;font-weight:700;color:var(--muted);background:var(--soft);border-radius:8px;padding:2px 8px}
.entry-h .chev{width:20px;height:20px;color:var(--muted);flex:none;transition:transform .2s}
.entry.open .entry-h .chev{transform:rotate(90deg)}
.entry-b{padding:2px 16px 8px 20px;border-top:1px solid var(--line);padding-top:12px}
.pinrow{display:flex;align-items:flex-start;gap:12px;background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:16px;cursor:pointer;font-weight:400}
.pinrow input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--court);flex:none}
.pinrow b{display:block;font-weight:700}
.pinrow small{display:block;color:var(--muted);font-size:.85rem}
.pinic{width:15px;height:15px;color:var(--court);margin-right:6px;vertical-align:-1px}
.entry.pinned{border-color:var(--court)!important;border-width:1.5px!important}
.btn.share{width:100%;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px}
.err.ok{color:var(--muted)}
.btn.share svg{width:20px;height:20px}
.entry-b{cursor:pointer;-webkit-user-select:none;user-select:none}
.entry-h{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks li::before{display:none!important}
.checks li.pt{gap:10px;align-items:flex-start;padding:3px 0}
.checks li.pt::before{content:"";display:block!important;flex:none;width:9px;height:9px;border-radius:3px;background:var(--pink);box-shadow:0 0 0 2px var(--court);margin-top:8px}
.checks li.pt span{cursor:default}
.checks li.sec{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 0 2px}
.checks li.sec:first-child{padding-top:2px}
.checks li{display:flex;align-items:center;gap:12px;padding:4px 0}
.checks li span{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.checks li.on span{color:var(--muted);text-decoration:line-through}
.cb{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;display:grid;place-items:center;color:transparent;cursor:pointer;padding:0}
.cb svg{width:16px;height:16px}
.checks li.on .cb{background:var(--court);border-color:var(--court);color:#fff}
.lst-b{cursor:default}
.quick{display:flex;gap:8px;margin:10px 0 4px;padding:0}
.quick input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px dashed var(--line);background:none;color:var(--ink)}
.quick button{flex:none;width:44px;border:0;border-radius:10px;background:var(--pink);color:var(--pink-ink);font-size:1.3rem;font-weight:700;cursor:pointer}
.logout{position:absolute;right:0;top:2px;z-index:1;border:0;border-radius:10px;padding:6px 12px;background:rgba(255,255,255,.2);color:#fff;font-weight:600;font-size:.85rem;cursor:pointer}
html{--sab:env(safe-area-inset-bottom,0px);background:var(--card)}
body{min-height:100vh}
html.gap .tabs{border-bottom:0}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
.login .hero{padding-bottom:40px}
.login form{max-width:420px;width:100%;margin:0 auto;padding:28px 20px}
.login p{color:var(--muted);margin:0 0 6px}
.login input[type=email],.login input[type=password]{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.login .btn{width:100%;margin-top:22px;padding:14px}
.status button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:inherit;padding:4px}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <header class="hero"><div class="hero-in"><h1>minha rotina</h1><small>entre uma vez e pronto</small></div></header>
  <form id="loginForm">
    <p>Use o mesmo e-mail e senha da ficha de exercícios.</p>
    <label for="lEmail">E-mail</label>
    <input type="email" id="lEmail" autocomplete="username" inputmode="email" autocapitalize="off">
    <label for="lPass">Senha</label>
    <input type="password" id="lPass" autocomplete="current-password">
    <p class="err" id="lErr"></p>
    <button type="submit" class="btn primary" id="lBtn">Entrar</button>
  </form>
</div>

<header class="hero">
  <div class="hero-in">
    <button type="button" class="logout" id="logout" hidden>sair</button>
    <h1>minha rotina</h1>
    <small id="heroSub"></small>
  </div>
</header>

<main class="wrap">
    <div id="progress" hidden></div>
  <div class="search" id="searchBox" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input type="search" id="q" placeholder="Pesquisar no diário" aria-label="Pesquisar no diário" autocomplete="off">
  </div>
  <ul class="list" id="list"></ul>
  <p class="status"><span id="status"></span></p>
</main>

<button class="add" id="addBtn">+ exercício</button>

<nav class="tabs" role="tablist">
  <div class="tabs-in">
    <button role="tab" data-tab="antes" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 4 4.5 4 9a4 4 0 0 1-8 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 0-7.5z"/></svg>pré</button>
    <button role="tab" data-tab="despues" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="1.8"/><path d="M4 9.5c3 1 5 1.2 8 1.2s5-.2 8-1.2M12 10.7v4.3l-3.5 5.5M12 15l3.5 5.5"/></svg>pós</button>
    <button role="tab" data-tab="diario" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg>diário</button>
    <button role="tab" data-tab="lista" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="5" height="5" rx="1.5"/><path d="M4.8 6.6l1 1 1.8-2"/><rect x="3.5" y="14" width="5" height="5" rx="1.5"/><path d="M12 6.5h8.5M12 16.5h8.5"/></svg>lista</button>
  </div>
</nav>

<!-- Exercício -->
<dialog id="exDlg">
  <form id="exForm">
    <h3 id="exTitle">Novo exercício</h3>
    <p class="altnote" id="altNote" hidden></p>
    <div id="mainFields">
    <span class="lbl">Tipo</span>
    <div class="types" id="fTipo">
      <button type="button" data-t="alongamento" aria-pressed="false">Alongamento</button>

  const g = e.target.closest("[data-group]");
  if (g) { const k = g.dataset.group; openGroups.has(k) ? openGroups.delete(k) : openGroups.add(k); render(); return; }
  const ga = e.target.closest("[data-gadd]");
  if (ga) { openEx(null, ga.dataset.gadd); return; }
  const btn = e.target.closest("[data-act]");
  if (btn && btn.dataset.act === "toggle") {
    const id = btn.closest(".ex").dataset.id;
    const arr = state.done[TODAY] = doneList();
    const k = arr.indexOf(id); k >= 0 ? arr.splice(k, 1) : arr.push(id);
    save(); render(); return;
  }
  const tap = e.target.closest("[data-tap]");
  if (!tap || e.target.closest("video, iframe")) return;
  const card = tap.closest(".ex"); const id = card.dataset.id;
  const ex = state.exercises.find(x => x.id === id);
  const now = Date.now();
  if (lastTap.id === id && now - lastTap.t < 350) {
    clearTimeout(tapTimer); lastTap = { id: null, t: 0 };
    const aid = tap.dataset.alt;
    aid ? openAlt(ex, ex.alts.find(a => a.id === aid)) : openEx(ex);
    return;
  }
  lastTap = { id, t: now };
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { openCards.has(id) ? openCards.delete(id) : openCards.add(id); render(); }, 300);
};

/* ---------- Formulário de exercício e de outras opções ---------- */
function setTipo(t) { fTipo = t; document.querySelectorAll("#fTipo button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t)); }
function setWhere(w) { fWhere = w; document.querySelectorAll("#fWhere button").forEach(b => b.setAttribute("aria-pressed", b.dataset.w === w)); }
$("#fTipo").onclick = e => { const b = e.target.closest("[data-t]"); if (b) setTipo(b.dataset.t); };
$("#fWhere").onclick = e => { const b = e.target.closest("[data-w]"); if (b) setWhere(b.dataset.w); };
function showPreview(url, kind) {
  const p = $("#preview");
  p.hidden = !url; $("#removeFoto").hidden = !url;
  $("#photoTxt").textContent = url ? "Trocar foto" : "Escolher da fototeca";
  p.innerHTML = !url ? "" : kind === "video" ? `<video src="${url}" controls playsinline></video>` : `<img src="${url}" alt="">`;
}
async function fillCommon(o) {
  pendingFile = null; removeMedia = false;
  $("#fNome").value = o?.nombre || "";
  $("#fDesc").value = o?.desc || "";
  $("#fFoto").value = ""; $("#exErr").textContent = "";
  showPreview(o?.media && o.media.kind !== "youtube" ? await mediaUrl(o.media) : null, o?.media?.kind);
}
function fillAlts(ex) {
  $("#altSection").hidden = !ex;
  if (!ex) return;
  $("#altList").innerHTML = ex.alts.map(a => `<li><span>${esc(a.nombre)}</span><button type="button" class="linkbtn" data-altedit="${a.id}">editar</button></li>`).join("");
  const same = exOfTab().filter(x => groupKey(x) === groupKey(ex));
  $("#moveUp").hidden = same.indexOf(ex) <= 0;
}
$("#altList").onclick = e => { const b = e.target.closest("[data-altedit]"); if (!b) return; const ex = state.exercises.find(x => x.id === editEx); $("#exDlg").close(); openAlt(ex, ex.alts.find(a => a.id === b.dataset.altedit)); };
$("#addAlt").onclick = () => { const ex = state.exercises.find(x => x.id === editEx); $("#exDlg").close(); openAlt(ex, null); };
$("#moveUp").onclick = () => {
  const ex = state.exercises.find(x => x.id === editEx); if (!ex) return;
  const same = exOfTab().filter(x => groupKey(x) === groupKey(ex)); const prev = same[same.indexOf(ex) - 1]; if (!prev) return;
  const a = state.exercises.indexOf(ex), b = state.exercises.indexOf(prev);
  [state.exercises[a], state.exercises[b]] = [state.exercises[b], state.exercises[a]];
  save(); render(); fillAlts(ex);
};
async function openEx(ex, tipoPadrao) {
  altParent = null; editAlt = null; editEx = ex ? ex.id : null;
  fillAlts(ex);
  $("#mainFields").hidden = false; $("#altNote").hidden = true;
  $("#exTitle").textContent = ex ? "Editar exercício" : "Novo exercício";
  setTipo(ex?.tipo || tipoPadrao || ""); setWhere("despues");
  $("#exDel").hidden = !ex;
  await fillCommon(ex);
  $("#exDlg").showModal();
}
async function openAlt(parent, alt) {
  altParent = parent.id; editAlt = alt ? alt.id : null; editEx = null;
  $("#altSection").hidden = true;
  $("#mainFields").hidden = true; $("#altNote").hidden = false;
  $("#altNote").textContent = `Outro exercício dentro de «${parent.nombre}». Toque no exercício para ver e arraste para o lado.`;
  $("#exTitle").textContent = alt ? "Editar exercício" : "Outro exercício";
  $("#exDel").hidden = !alt;
  await fillCommon(alt);
  $("#exDlg").showModal();
}
$("#fFoto").onchange = e => { const f = e.target.files[0]; if (!f) return; pendingFile = f; removeMedia = false; showPreview(URL.createObjectURL(f), f.type.startsWith("video/") ? "video" : "image"); };
$("#removeFoto").onclick = () => { pendingFile = null; removeMedia = true; $("#fFoto").value = ""; showPreview(null); };
$("#exCancel").onclick = () => $("#exDlg").close();
$("#exDel").onclick = () => {
  const del = $("#exDel");
  if (del.dataset.sure !== "1") { del.dataset.sure = "1"; del.textContent = "Apagar mesmo?"; return; }
  if (altParent) {
    const p = state.exercises.find(x => x.id === altParent); const a = p?.alts.find(x => x.id === editAlt);
    if (a) { p.alts = p.alts.filter(x => x !== a); dropMedia(a.media); }
  } else {
    const ex = state.exercises.find(x => x.id === editEx); if (!ex) return;
    state.exercises = state.exercises.filter(x => x !== ex);
    dropMedia(ex.media); ex.alts.forEach(a => dropMedia(a.media));
  }
  save(); render(); $("#exDlg").close();
};
$("#exDlg").addEventListener("close", () => { $("#exDel").dataset.sure = ""; $("#exDel").textContent = "Apagar"; });
$("#exForm").onsubmit = async ev => {
  ev.preventDefault();
  const nombre = $("#fNome").value.trim();
  if (!altParent && !fTipo) { $("#exErr").textContent = "Escolha se é rolo, mobilidade ou alongamento."; return; }
  if (!nombre) { $("#exErr").textContent = "Escreva o nome do exercício."; return; }
  if (saving) return; saving = true;
  const sb = $("#exSave"); sb.disabled = true; sb.textContent = pendingFile ? "Enviando…" : "Salvando…";
  try {
    const parent = altParent ? state.exercises.find(x => x.id === altParent) : null;
    const target = parent ? parent.alts.find(x => x.id === editAlt) : state.exercises.find(x => x.id === editEx);
    const old = target?.media || null;
    let media = old;
    if (pendingFile) media = await storeMedia(pendingFile);
    else if (removeMedia) media = null;
    const base = { nombre, desc: $("#fDesc").value.trim(), media };
    if (parent) {
      if (target) Object.assign(target, base); else parent.alts.push({ id: uid(), ...base });
    } else {
      const data = { ...base, sec: fWhere, tipo: fTipo };
      if (target) { Object.assign(target, data); delete target.dosis; } else state.exercises.push({ id: uid(), alts: [], ...data });
      tab = fWhere; openGroups.add(fWhere + ":" + fTipo);
    }
    if (old && old !== media) dropMedia(old);
    save(); render(); $("#exDlg").close();
    if (parent) { openCards.add(parent.id); render(); openEx(parent); }
  } catch (e) { $("#exErr").textContent = e.message || "Não deu para salvar. Tente de novo."; }
  finally { saving = false; sb.disabled = false; sb.textContent = "Salvar"; }
};

/* ---------- Listas ---------- */
const openListas = new Set();
const boxSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function renderListas() {
  const list = $("#list");
  if (!state.listas.length) { list.innerHTML = `<li class="empty"><b>Nenhuma lista ainda</b>Toque em «+ lista» para criar uma, com título e itens para marcar.</li>`; return; }
  list.innerHTML = state.listas.map(l => {
    const isSec = i => /:\s*$/.test(i.texto);
    const marcaveis = l.itens.filter(i => !isSec(i));
    const open = openListas.has(l.id), feitos = marcaveis.filter(i => i.feito).length;
    return `<li class="entry lst ${open ? "open" : ""}" data-li="${l.id}">
      <button class="entry-h" data-litoggle aria-expanded="${open}">
        <span class="t"><b>${esc(l.titulo)}</b></span>
        ${!open && marcaveis.length ? `<em>${marcaveis.length}</em>` : ""}
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      ${open ? `<div class="entry-b lst-b">
        ${marcaveis.length || l.itens.length ? `<ul class="checks">${l.itens.map(i => isSec(i) ? `<li class="sec">${esc(i.texto.replace(/:\s*$/, ""))}</li>` : `<li class="pt"><span>${esc(i.texto)}</span></li>`).join("")}</ul>` : `<p class="none">Lista vazia.</p>`}
        <form class="quick" data-quick><input type="text" placeholder="Adicionar item" aria-label="Novo item" enterkeyhint="done"><button type="submit" aria-label="Adicionar">+</button></form>
      </div>` : ""}
    </li>`;
  }).join("");
}
$("#list").addEventListener("submit", e => {
  const f = e.target.closest("[data-quick]"); if (!f) return;
  e.preventDefault();
  const inp = f.querySelector("input"), t = inp.value.trim(); if (!t) return;
  const l = state.listas.find(x => x.id === f.closest("[data-li]").dataset.li);
  l.itens.push({ id: uid(), texto: t, feito: false }); save(); renderListas(); render();
  const again = $(`[data-li="${l.id}"] [data-quick] input`); if (again) again.focus();
});
$("#list").addEventListener("click", e => {
  const li = e.target.closest("[data-li]"); if (!li || tab !== "lista") return;
  const l = state.listas.find(x => x.id === li.dataset.li); if (!l) return;
  const h = e.target.closest("[data-litoggle]");
  if (!h) return;
  const now = Date.now();
  if (lastTap.id === "li:" + l.id && now - lastTap.t < 350) { clearTimeout(tapTimer); lastTap = { id: null, t: 0 }; openLi(l); return; }
  lastTap = { id: "li:" + l.id, t: now };
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { openListas.has(l.id) ? openListas.delete(l.id) : openListas.add(l.id); render(); }, 300);
});
let editLi = null;
function addLiLine(v = "", feito = false, id = "") {
  const d = document.createElement("div"); d.className = "ln";
  d.innerHTML = `<input type="text" placeholder="Ex.: Raquete reserva" aria-label="Item"><button type="button" aria-label="Tirar">×</button>`;
  const inp = d.querySelector("input"); inp.value = v; inp.dataset.feito = feito ? "1" : ""; inp.dataset.id = id;
  d.querySelector("button").onclick = () => { d.remove(); if (!$("#fLiItens").children.length) addLiLine(); };
  $("#fLiItens").appendChild(d);
  return inp;
}
$("#addLiItem").onclick = () => addLiLine().focus();
function openLi(l) {
  editLi = l ? l.id : null;
  $("#liTitle").textContent = l ? "Editar lista" : "Nova lista";
  $("#fLiNome").value = l?.titulo || "";
  $("#fLiItens").innerHTML = "";
  (l?.itens?.length ? l.itens : [{}]).forEach(i => addLiLine(i.texto || "", i.feito, i.id || ""));
  $("#liErr").textContent = ""; $("#liDel").hidden = !l;
  $("#liDlg").showModal();
}
$("#liCancel").onclick = () => $("#liDlg").close();
$("#liDel").onclick = () => {
  const b = $("#liDel");
  if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Apagar mesmo?"; return; }
  state.listas = state.listas.filter(x => x.id !== editLi); save(); render(); $("#liDlg").close();
};
$("#liDlg").addEventListener("close", () => { $("#liDel").dataset.sure = ""; $("#liDel").textContent = "Apagar"; });
$("#liForm").onsubmit = e => {
  e.preventDefault();
  const titulo = $("#fLiNome").value.trim();
  if (!titulo) { $("#liErr").textContent = "Escreva o título da lista."; return; }
  const itens = [...$("#fLiItens").querySelectorAll("input")].map(i => ({ id: i.dataset.id || uid(), texto: i.value.trim(), feito: i.dataset.feito === "1" })).filter(i => i.texto);
  const l = state.listas.find(x => x.id === editLi);
  if (l) Object.assign(l, { titulo, itens });
  else { const n = { id: uid(), titulo, itens }; state.listas.push(n); openListas.add(n.id); }
  save(); render(); $("#liDlg").close();
};

/* ---------- Formulário do diário ---------- */
function addLine(v = "") {
  const d = document.createElement("div"); d.className = "ln";
  d.innerHTML = `<input type="text" placeholder="Ex.: Respirar antes de sacar" aria-label="Aprendizado"><button type="button" aria-label="Tirar">×</button>`;
  d.querySelector("input").value = v;
  d.querySelector("button").onclick = () => { d.remove(); if (!$("#fLearn").children.length) addLine(); };
  $("#fLearn").appendChild(d);
  return d.querySelector("input");
}
$("#addLine").onclick = () => addLine().focus();
function openDi(d) {
  editDi = d ? d.id : null;
  $("#diTitle").textContent = d ? "Editar registro" : "Novo registro";
  $("#fTorneio").value = d?.torneio || "";
  $("#fSemana").value = d?.semana || "";
  $("#fFixar").checked = !!d?.fixado;
  $("#fLearn").innerHTML = "";
  (d?.aprendizados?.length ? d.aprendizados : [""]).forEach(a => addLine(a));
  $("#diErr").textContent = ""; $("#diErr").classList.remove("ok");
  $("#diDel").hidden = !d;
  $("#diDlg").showModal();
}
$("#diCancel").onclick = () => $("#diDlg").close();
$("#diShare").onclick = async () => {
  const torneio = $("#fTorneio").value.trim(), semana = $("#fSemana").value.trim();
  const ap = [...$("#fLearn").querySelectorAll("input")].map(i => i.value.trim()).filter(Boolean);
  const text = [torneio, semana, "", ap.length ? "O que eu aprendi:" : "", ...ap.map(a => "• " + a)].filter((l, i, a) => l || (i > 0 && a[i - 1])).join("\n").trim();
  if (!text) { $("#diErr").textContent = "Escreva alguma coisa antes de compartilhar."; return; }
  try {
    if (navigator.share) { await navigator.share({ title: torneio || "Diário", text }); return; }
  } catch (err) { if (err && err.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); $("#diErr").textContent = "Copiado! Agora é só colar na mensagem."; $("#diErr").classList.add("ok"); }
  catch { $("#diErr").textContent = "Não deu para compartilhar daqui."; }
};
$("#diDel").onclick = () => {
  if ($("#diDel").dataset.sure !== "1") { $("#diDel").dataset.sure = "1"; $("#diDel").textContent = "Apagar mesmo?"; return; }
  state.diario = state.diario.filter(x => x.id !== editDi); save(); render(); $("#diDlg").close();
};
$("#diDlg").addEventListener("close", () => { $("#diDel").dataset.sure = ""; $("#diDel").textContent = "Apagar"; });
$("#diForm").onsubmit = e => {
  e.preventDefault();
  const torneio = $("#fTorneio").value.trim(), semana = $("#fSemana").value.trim(), fixado = $("#fFixar").checked;
  const aprendizados = [...$("#fLearn").querySelectorAll("input")].map(i => i.value.trim()).filter(Boolean);
  if (!torneio && !semana) { $("#diErr").textContent = "Escreva o torneio, um título ou a data."; return; }
  const d = state.diario.find(x => x.id === editDi);
  if (d) Object.assign(d, { torneio, semana, aprendizados, fixado });
  else state.diario.push({ id: uid(), torneio, semana, aprendizados, fixado });
  save(); render(); $("#diDlg").close();
};


/* ---------- Deslizar para trocar de aba ---------- */
(() => {
  const ORDER = ["antes", "despues", "diario", "lista"];
  let x0 = null, y0 = null, t0 = 0;
  document.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || document.querySelector("dialog[open]") || (e.target.closest && e.target.closest("[data-slides], input, textarea, video, iframe"))) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - t0 > 700) return;
    const i = ORDER.indexOf(tab) + (dx > 0 ? -1 : 1);
    if (i < 0 || i >= ORDER.length) return;
    tab = ORDER[i]; render(); window.scrollTo(0, 0);
  }, { passive: true });
})();

/* ---------- Entrar e sincronizar ---------- */
async function sync() {
  if (!user) return;
  $("#logout").hidden = false;
  if (pending()) { await push(); return; }
  try {
    const { data, error } = await sb.from(TABLE).select("data").eq("user_id", user.id).maybeSingle();
    if (error) throw error;
    if (data && data.data) { state = normalize(data.data); saveLocal(); render(); setStatus(""); }
    else {
      if (!state.exercises.length && !state.diario.length && !state.listas.length) { state = normalize(JSON.parse(JSON.stringify(SEED))); render(); }
      save();
    }
  } catch { setStatus(navigator.onLine ? "Não deu para carregar da nuvem. Mostrando o que está no celular." : "Sem internet. Mostrando o que está no celular."); }
}
function showLogin(v) { $("#login").hidden = !v; }
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  const email = $("#lEmail").value.trim(), password = $("#lPass").value;
  if (!email || !password) { $("#lErr").textContent = "Escreva o e-mail e a senha."; return; }
  const bt = $("#lBtn"); bt.disabled = true; bt.textContent = "Entrando…"; $("#lErr").textContent = "";
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    user = data.user; showLogin(false); $("#lPass").value = "";
    await sync();
  } catch (err) {
    $("#lErr").textContent = !navigator.onLine ? "Sem internet. Conecte para entrar pela primeira vez." : /invalid/i.test(err?.message || "") ? "E-mail ou senha errados." : "Não deu para entrar. Tente de novo.";
  } finally { bt.disabled = false; bt.textContent = "Entrar"; }
};
$("#logout").onclick = async () => {
  if ($("#logout").dataset.sure !== "1") { $("#logout").dataset.sure = "1"; $("#logout").textContent = "sair mesmo?"; setTimeout(() => { $("#logout").dataset.sure = ""; $("#logout").textContent = "sair"; }, 4000); return; }
  if (pending()) await push();
  try { await sb.auth.signOut(); } catch {}
  user = null; try { localStorage.removeItem(LS_KEY); } catch {}
  state = normalize({}); render(); $("#logout").hidden = true; showLogin(true);
};

loadLocal(); render();
(async () => {
  if (!sb) { setStatus("Não deu para carregar. Confira a internet e abra de novo."); return; }
  let session = null;
  try { ({ data: { session } } = await sb.auth.getSession()); } catch {}
  if (!session) { showLogin(true); return; }
  user = session.user;
  await sync();
})();
/* iPhone: no modo app, a tela às vezes fica mais curta que o aparelho e sobra um espaço embaixo das abas */
function fixGap() {
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  let g = 0;
  if (standalone) {
    const full = innerHeight > innerWidth ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
    g = full - innerHeight;
    if (g < 0 || g > 80) g = 0;
  }
  // O pedaço que sobra embaixo fica branco como as abas, e as abas não precisam de margem extra.
  document.documentElement.classList.toggle("gap", g > 0);
  document.documentElement.style.setProperty("--sab", g > 0 ? "0px" : "env(safe-area-inset-bottom, 0px)");
}
fixGap(); addEventListener("resize", fixGap); addEventListener("orientationchange", () => setTimeout(fixGap, 300));
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
